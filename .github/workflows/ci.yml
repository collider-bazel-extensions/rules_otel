name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    # Everything that needs no container runtime: the config check, the
    # hermetic collector (otel_collector_test / otel_collector_server, the
    # sink, restart, failure and cleanup), pins, analysis tests, and the
    # committed chart render.
    name: bazel test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-test
          repository-cache: true

      - name: bazel build //...
        run: bazel build //...

      - name: bazel test //tests/...
        run: bazel test //tests/... --test_output=errors

      - name: A bad config fails the build
        run: |
          if bazel build //tests/testdata:bad_ref 2> build.log; then
            echo "FAIL: //tests/testdata:bad_ref built" >&2; exit 1
          fi
          grep -q 'references exporter "otlphttp/mimr" which is not configured' build.log

      - name: A bad --set in extra_args fails the build
        run: |
          if bazel build //tests:bad_set_server 2> build.log; then
            echo "FAIL: //tests:bad_set_server built" >&2; exit 1
          fi
          grep -q "refused its config with --set=processors.batch.timeout=banana" build.log

      - name: Committed manifest matches the render
        run: |
          bazel run //tools:render_writeback_0_153_0
          git diff --exit-code private/manifests/otel.yaml

      - name: No collectors left behind
        if: always()
        run: |
          if pgrep -x otelcol-contrib; then echo "FAIL: otelcol-contrib processes left running" >&2; exit 1; fi

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-testlogs-test
          path: bazel-testlogs/
          if-no-files-found: ignore

  smoke:
    # End-to-end: kind + OpenTelemetry Collector (deployment mode,
    # OTLP receiver, debug exporter at verbosity:detailed). Smoke
    # POSTs an OTLP/JSON trace at the collector and greps the
    # collector pod logs for a unique marker attribute.
    name: smoke (ubuntu-latest, docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-smoke
          repository-cache: true

      - name: Verify Docker is available
        run: docker version

      - name: bazel test //tests:smoke_test
        run: bazel test //tests:smoke_test --test_output=streamed --test_timeout=900

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-testlogs-smoke
          path: bazel-testlogs/
          if-no-files-found: ignore
