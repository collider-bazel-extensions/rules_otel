# A production-shaped collector config: fixed ports, env-expanded backends
# (Mimir over OTLP/HTTP and remote write), short retries, a sending queue.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: ${env:MY_POD_IP}:4317
      http:
        endpoint: ${env:MY_POD_IP}:4318
processors:
  batch:
    timeout: 100ms
exporters:
  otlphttp/mimir:
    endpoint: ${env:MIMIR_URL}
    headers:
      X-Scope-OrgID: ${env:TENANT:-anonymous}
    retry_on_failure:
      initial_interval: 200ms
      max_interval: 1s
      max_elapsed_time: 120s
    sending_queue:
      queue_size: 100
  prometheusremotewrite/mimir:
    endpoint: ${env:MIMIR_URL}/api/v1/push
    retry_on_failure:
      initial_interval: 200ms
      max_interval: 1s
  debug:
    verbosity: basic
extensions:
  health_check:
    endpoint: ${env:MY_POD_IP}:13133
service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/mimir, prometheusremotewrite/mimir, debug]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/mimir]
